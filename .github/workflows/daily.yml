name: Daily picks

on:
  schedule:
    # 12:00 UTC is 5 AM in Los Angeles during daylight time, 4 AM in winter.
    # GitHub can start scheduled runs late, so this leaves room before the day starts at 6.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Redo today even if it was already picked'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick today
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: node src/build.mjs

      - name: Save
        run: |
          git config user.name "daily-picks"
          git config user.email "daily-picks@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Picks for $(TZ=America/Los_Angeles date +%Y-%m-%d)"
            git push
          fi
